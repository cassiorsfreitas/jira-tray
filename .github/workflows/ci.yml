name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.script }}
    # The app only runs on macOS, and so does the lockfile's platform set.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        script: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}

  package:
    name: package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      # A broken signature makes macOS refuse the app any Keychain access, so
      # Settings could not save the API token. Prints nothing when it is valid.
      - name: The app's signature is valid
        run: codesign -v out/*-darwin-*/"Jira Tray.app"
