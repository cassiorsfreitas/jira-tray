name: Feature request
description: Suggest an idea or an improvement
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Jira Tray is a small macOS menu bar app, and the goal is to keep it that way. A clear problem is more useful than a ready-made solution.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I read the README and searched the open issues.
          required: true
