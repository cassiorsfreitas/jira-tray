<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Ticket card outline — shifted slightly left/down to make room for dot -->
  <rect x="1.5" y="3" width="11.5" height="11" rx="2" fill="none" stroke="black" stroke-width="1.5"/>
  <!-- Ticket item lines -->
  <line x1="4"   y1="6.5"  x2="11"  y2="6.5"  stroke="black" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4"   y1="9"    x2="11"  y2="9"    stroke="black" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4"   y1="11.5" x2="8.5" y2="11.5" stroke="black" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Alert dot — white ring separates it from the icon -->
  <circle cx="13.5" cy="2.5" r="3.5" fill="white"/>
  <circle cx="13.5" cy="2.5" r="2.5" fill="#FF9500"/>
</svg>
