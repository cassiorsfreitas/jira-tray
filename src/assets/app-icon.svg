<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon source. macOS icon grid: the artwork is an 824px rounded square
       centred on a 1024px canvas, so there is room for the shadow.
       Generate the .icns with: npm run generate-app-icon -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fa9ff"/>
      <stop offset="1" stop-color="#1d5fe0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>

  <!-- The ticket card of the Tray icon -->
  <g filter="url(#card-shadow)">
    <rect x="277" y="297" width="470" height="430" rx="72" fill="#fff"/>
  </g>
  <rect x="345" y="410" width="334" height="42" rx="21" fill="#2d6fe8"/>
  <rect x="345" y="490" width="334" height="42" rx="21" fill="#2d6fe8"/>
  <rect x="345" y="570" width="206" height="42" rx="21" fill="#2d6fe8"/>

  <!-- The Alert Icon's dot, ring included -->
  <circle cx="748" cy="296" r="96" fill="#fff"/>
  <circle cx="748" cy="296" r="70" fill="#FF9500"/>
</svg>
